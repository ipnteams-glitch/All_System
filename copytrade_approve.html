<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อตกลงการใช้งานซอฟต์แวร์ EA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            background: #080c14;
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .approve-container {
            max-width: 750px;
            margin: 30px auto;
            padding: 0 10px;
        }
        @keyframes newServicePulse {
            0%, 100% { text-shadow: 0 0 8px rgba(0,229,255,0.3), 0 0 16px rgba(0,180,255,0.15); opacity: 0.85; }
            50% { text-shadow: 0 0 22px rgba(0,229,255,0.8), 0 0 40px rgba(0,180,255,0.5); opacity: 1; }
        }
        .approve-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .approve-header h4 {
            color: #00e5ff;
            font-size: 1.3rem;
            font-weight: 700;
            text-shadow: 0 0 14px rgba(0,229,255,0.7), 0 0 28px rgba(0,180,255,0.4);
            animation: newServicePulse 1.8s ease-in-out infinite;
            letter-spacing: 0.5px;
        }
        .approve-header small {
            color: #888 !important;
            font-size: 0.75rem;
            animation: none;
            text-shadow: none;
        }
        .approve-card {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 20px 24px;
            border: 1px solid rgba(255,255,255,0.08);
            max-height: 55vh;
            overflow-y: auto;
        }
        .approve-card::-webkit-scrollbar { width: 6px; }
        .approve-card::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 3px; }
        .approve-card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .approve-text {
            white-space: pre-line;
            font-size: 0.85rem;
            color: #b0b0b0;
            line-height: 1.8;
        }
        .approve-text strong { color: #00e5ff; }
        .btn-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .btn-decline {
            background: linear-gradient(135deg, #a83232 0%, #c0392b 100%);
            color: #fff;
            border: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168,50,50,0.3);
        }
        .btn-decline:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168,50,50,0.5); }
        .btn-accept {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
            border: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(17,153,142,0.3);
        }
        .btn-accept:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56,239,125,0.5); }
        .btn-row small { width: 100%; text-align: center; color: #888; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="approve-container">
        <div class="approve-header">
            <h4>ข้อตกลงและเงื่อนไขการใช้งานซอฟต์แวร์ EA<br><small>EA Software Terms of Service & Risk Disclaimer</small></h4>
        </div>
        <div class="approve-card">
            <div class="approve-text" id="approveText">Loading...</div>
        </div>
        <div class="btn-row">
            <button class="btn-decline" onclick="decline()">ไม่ยอมรับ / Decline</button>
            <button class="btn-accept" onclick="accept()">ยอมรับ / Accept</button>
            <small>การกดยอมรับแสดงว่าท่านได้อ่านและเข้าใจข้อตกลงทั้งหมดแล้ว</small>
        </div>
    </div>

    <script>
        const TEXT_CONTENT = `ข้อตกลงและเงื่อนไขการใช้งานซอฟต์แวร์ EA

1. บริการนี้เป็นการให้เช่าสิทธิ์ใช้งานซอฟต์แวร์ EA เป็นเครื่องมือส่วนบุคคล เพื่อการศึกษาและทดสอบกลยุทธ์การเทรด

2. แนะนำให้ผู้ใช้ทดสอบบนบัญชี Demo ก่อนการใช้งานจริงทุกครั้ง หากผู้ใช้เลือกใช้กับบัญชีเงินจริง ถือเป็นการตัดสินใจและความรับผิดชอบของผู้ใช้แต่เพียงผู้เดียว

3. ผู้ให้บริการไม่เข้าถึงหรือควบคุมบัญชีซื้อขายของผู้ใช้ ไม่รับฝากเงิน ไม่ร่วมลงทุน และไม่รับส่วนแบ่งกำไรใด ๆ

4. ผู้ให้บริการไม่การันตีผลกำไรหรือผลการทำงานของซอฟต์แวร์ ผลในอดีตไม่ยืนยันผลในอนาคต การเทรดมีความเสี่ยงสูง ผู้ใช้อาจสูญเสียเงินลงทุนบางส่วนหรือทั้งหมด

5. ลิขสิทธิ์ซอฟต์แวร์เป็นของผู้ให้บริการ ห้ามทำซ้ำ ดัดแปลง แจกจ่าย หรือขายต่อ

6. ผู้ให้บริการมีสิทธิ์ระงับ License หากพบการละเมิดเงื่อนไข โดยไม่คืนค่าเช่า

7. ผู้ให้บริการเป็นเพียงผู้ให้บริการซอฟต์แวร์ ไม่ใช่ที่ปรึกษาการลงทุน ไม่ชักชวน ไม่ระดมทุน ไม่ชี้นำการลงทุน

8. ข้อตกลงนี้อยู่ภายใต้กฎหมายไทย และเขตอำนาจศาลไทย

การกดยอมรับ แสดงว่าผู้ใช้เข้าใจและยอมรับว่าการตัดสินใจและผลที่เกิดขึ้นทั้งหมดเป็นของผู้ใช้เอง 100%

------------------------------------------------------------

EA Software Terms of Service & Risk Disclaimer

1. This service licenses the EA software as a personal tool for education and strategy testing.

2. Users are advised to test on a Demo account before any live use. If a user chooses to use it on a real-money account, that is the user's own decision and sole responsibility.

3. The provider does not access or control the user's trading account, does not take deposits, does not co-invest, and does not take any profit share.

4. The provider does not guarantee any profit or software performance. Past results do not guarantee future results. Trading carries high risk; users may lose part or all of their capital.

5. Software copyright belongs to the provider. Reproduction, modification, distribution, or resale is prohibited.

6. The provider may suspend the License upon any breach, without refund.

7. The provider is only a software provider, not an investment advisor. We do not solicit, raise funds, or give investment advice.

8. These terms are governed by Thai law and the jurisdiction of Thai courts.

By accepting, the user acknowledges that all decisions and outcomes are 100% their own.`;

        document.getElementById('approveText').textContent = TEXT_CONTENT;

        const params = new URLSearchParams(window.location.search);
        const targetUrl = params.get('url');

        function accept() {
            if (targetUrl) {
                try {
                    const decoded = decodeURIComponent(targetUrl);
                    window.location.href = decoded;
                } catch(e) {
                    window.location.href = targetUrl;
                }
            } else {
                window.location.href = 'index.html';
            }
        }

        function decline() {
            // ปิดแท็บนี้ (หน้า approve เปิดในแท็บใหม่จากปุ่ม Copy/ชื่อโมเดล)
            window.close();
            // เผื่อเบราว์เซอร์ไม่ยอมปิด (เช่นเปิดหน้านี้ตรงๆ) → กลับหน้าแรก
            setTimeout(function () {
                var ref = document.referrer || '';
                window.location.href = ref.includes('index_en') ? 'index_en.html' : 'index.html';
            }, 200);
        }
    </script>
</body>
</html>
