<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Trading Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1c1f26;
            --text-main: #e2e8f0;
            --gold: #D4AF37;
            --green: #10b981;
            --red: #ef4444;
            --border: #2d333b;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 20px 10px; 
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto; 
        }
        .header-box {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }
        .header-box h1 {
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .header-box p {
            color: #8b949e;
            margin-top: 0;
            font-size: 14px;
        }
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right; 
        }
        th, td {
            padding: 12px 14px;
            white-space: nowrap;
        }
        th:first-child, td:first-child {
            min-width: 130px;
        }
        .ea-name-cell {
            font-weight: bold;
            color: #ffeb3b;
            font-size: 14px;
        }
        th {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            font-weight: 500;
            font-size: 15px;
            border-bottom: 2px solid var(--gold);
        }
        th:first-child, td:first-child {
            text-align: left; 
        }
        td {
            border-bottom: 1px solid var(--border);
            font-size: 15px;
            color: #c9d1d9;
        }
        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
            transition: 0.2s;
        }
        .text-green { color: var(--green); font-weight: 500; }
        .text-red { color: var(--red); font-weight: 500; }
        .text-bold { font-weight: 600; }
        .loader {
            text-align: center;
            padding: 40px;
            color: var(--gold);
            font-size: 18px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: #8b949e;
            text-decoration: none;
            border: 1px solid #8b949e;
            padding: 8px 20px;
            border-radius: 6px;
            transition: 0.3s;
        }
        .back-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        /* ── Summary Row ── */
        tfoot td {
            background: linear-gradient(90deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
            border-top: 2px solid var(--gold);
            font-weight: 600;
            font-size: 16px;
            color: var(--gold);
            padding: 14px 20px;
        }
        tfoot td:first-child {
            text-align: right;
            letter-spacing: 1px;
        }
        /* ── Star Ratings ── */
        .stars {
            display: inline-block;
            font-size: 16px;
            letter-spacing: 2px;
            margin-top: 2px;
        }
        .star-on { color: #D4AF37; }
        .star-off { color: #3a3f4b; }
        @media (max-width: 600px) {
            th, td { padding: 8px 6px; font-size: 11px; }
            th { font-size: 10px; }
            .header-box h1 { font-size: 20px; }
            th:first-child, td:first-child { min-width: 80px; }
            .ea-name-cell { font-size: 10px; }
            .stars { font-size: 11px; letter-spacing: 0; }
            tfoot td { font-size: 12px; padding: 8px 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>🏆 Live Trading Performance</h1>
            <p>อัปเดตข้อมูลพอร์ตการลงทุนแบบ Real-Time</p>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ชื่อ EA</th>
                        <th>กำไรปัจจุบัน</th>
                        <th>กำไรสัปดาห์ จ-ศ</th>
                        <th>ทุนเริ่มต้น</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4"><div class="loader">⏳ กำลังโหลดข้อมูล...</div></td>
                    </tr>
                </tbody>
                <tfoot id="tableFoot" style="display:none;">
                    <tr>
                        <td>📊 ผลรวม</td>
                        <td id="sumProfit">-</td>
                        <td id="sumWeek">-</td>
                        <td id="sumBalance">-</td>
                    </tr>
                </tfoot>
            </table>
        </div>
        <div style="text-align: center;">
            <a href="index.html" class="back-btn">← กลับหน้าหลัก</a>
        </div>
    </div> 
<script>
    const SHEET_ID = "1B2XVPTkg4HBtd8XlQBwOSlisakAkyR1HbGIz1-wVxAU";
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;

    function formatNumber(num) {
        if (isNaN(num)) return "0.00";
        return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ⭐ สร้าง HTML ดาว
    function renderStars(count) {
        let html = '<div class="stars">';
        for (let i = 0; i < 5; i++) {
            html += i < count ? '<span class="star-on">★</span>' : '<span class="star-off">★</span>';
        }
        html += '</div>';
        return html;
    }

    async function fetchRealTimeData() {
        try {
            const cacheBuster = "&t=" + new Date().getTime();
            const response = await fetch(GVIZ_URL + cacheBuster);
            const text = await response.text();
            const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
            const jsonData = JSON.parse(jsonString);
            const tableBody = document.getElementById('tableBody') || document.querySelector('tbody');
            if (!tableBody) return;
            tableBody.innerHTML = ''; 
            const rows = jsonData.table.rows;
            if (!rows || rows.length <= 1) { 
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">กำลังรอรับข้อมูลจากระบบ...</td></tr>';
                return;
            }
            let data = [];
            for (let i = 0; i < rows.length; i++) {
                let row = rows[i];
                if (row && row.c && row.c[0] && row.c[0].v !== null && String(row.c[0].v).toLowerCase() !== "acc") { 
                    const balance = row.c[2] && row.c[2].v !== null ? parseFloat(row.c[2].v) : 0;
                    const profit7day = row.c[6] && row.c[6].v !== null ? parseFloat(row.c[6].v) : 0;
                    // ⭐ ดึงค่าดาวโดยตรงจากคอลัมน์ I (index 8) — คำนวณฝั่ง server แล้ว
                    const stars = row.c[8] && row.c[8].v !== null ? parseInt(row.c[8].v) : 0;
                    data.push({
                        name: row.c[1] && row.c[1].v !== null ? row.c[1].v : "-",
                        balance: balance,
                        profit: row.c[4] && row.c[4].v !== null ? parseFloat(row.c[4].v) : 0,
                        profit7day: profit7day,
                        stars: stars
                    });
                }
            }
            data.sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { numeric: true, sensitivity: 'base' }));
            
            let sumProfit = 0, sumWeek = 0, sumBalance = 0;
            
            data.forEach(row => {
                sumProfit += row.profit;
                sumWeek += row.profit7day;
                sumBalance += row.balance;
                
                let profitColor = row.profit > 0 ? '#4cd137' : (row.profit < 0 ? '#ff3b3b' : '#ffffff');
                let p7Color = row.profit7day > 0 ? '#4cd137' : (row.profit7day < 0 ? '#ff3b3b' : '#ffffff');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <span class="ea-name-cell">${row.name}</span>
                        ${renderStars(row.stars)}
                    </td>
                    <td style="color: ${profitColor}; font-weight: 500;">${row.profit > 0 ? '+' : ''}${formatNumber(row.profit)}</td>
                    <td style="color: ${p7Color}; font-weight: 500;">${row.profit7day > 0 ? '+' : ''}${formatNumber(row.profit7day)}</td>
                    <td>$${formatNumber(row.balance)}</td>
                `;
                tableBody.appendChild(tr);
            });
            
            // Summary row
            const sumColor = sumProfit > 0 ? '#4cd137' : (sumProfit < 0 ? '#ff3b3b' : '#D4AF37');
            const weekColor = sumWeek > 0 ? '#4cd137' : (sumWeek < 0 ? '#ff3b3b' : '#D4AF37');
            document.getElementById('sumProfit').innerHTML = `<span style="color:${sumColor}">${sumProfit > 0 ? '+' : ''}${formatNumber(sumProfit)}</span>`;
            document.getElementById('sumWeek').innerHTML = `<span style="color:${weekColor}">${sumWeek > 0 ? '+' : ''}${formatNumber(sumWeek)}</span>`;
            document.getElementById('sumBalance').innerHTML = `$${formatNumber(sumBalance)}`;
            document.getElementById('tableFoot').style.display = '';
        } catch (error) {
            console.error("Fetch Error:", error);
            const tableBody = document.getElementById('tableBody') || document.querySelector('tbody');
            if(tableBody) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: #ff3b3b; padding: 20px;">❌ เกิดข้อผิดพลาด หรือไฟล์ Google Sheet ยังไม่เปิดแชร์</td></tr>';
            }
        }
    }

    fetchRealTimeData();
    setInterval(fetchRealTimeData, 3000); 
</script>    
</body>
</html>
