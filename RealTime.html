<script>
        // 🔴 ใช้ช่องทาง Google Visualization API แทน CSV (ทะลุบล็อก CORS และโหลดเร็วมาก)
        const SHEET_ID = "1B2XVPTkg4HBtd8XlQBwOSlisakAkyR1HbGIz1-wVxAU";
        const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;

        function formatNumber(num) {
            return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function getColorClass(num) {
            if (num > 0) return 'text-green';
            if (num < 0) return 'text-red';
            return '';
        }

        async function fetchRealTimeData() {
            try {
                // ใส่ตัวแปรกำจัด Cache 
                const cacheBuster = "&t=" + new Date().getTime();
                const response = await fetch(GVIZ_URL + cacheBuster);
                const text = await response.text();
                
                // ตัดข้อความส่วนเกินที่ Google แถมมาออก ให้เหลือแค่ JSON แท้ๆ
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const jsonData = JSON.parse(jsonString);
                
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = ''; 

                const rows = jsonData.table.rows;

                // หากไม่มีข้อมูล
                if (!rows || rows.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ไม่มีข้อมูลแสดงผล</td></tr>';
                    return;
                }

                let data = [];
                
                // วนลูปดึงข้อมูลจากโครงสร้าง JSON ของ Google
                rows.forEach(row => {
                    // ป้องกันการดึงแถวหัวตาราง (acc_Number) มาแสดง
                    if (row.c && row.c[0] && row.c[0].v !== null && String(row.c[0].v).toLowerCase() !== "acc_number") {
                        data.push({
                            name: row.c[1] && row.c[1].v !== null ? row.c[1].v : "-",
                            balance: row.c[2] && row.c[2].v !== null ? parseFloat(row.c[2].v) : 0,
                            profit: row.c[4] && row.c[4].v !== null ? parseFloat(row.c[4].v) : 0,
                            profit7day: row.c[6] && row.c[6].v !== null ? parseFloat(row.c[6].v) : 0
                        });
                    }
                });

                // จัดเรียงชื่อ EA อย่างถูกต้อง (Sys1, Sys2... Sys10)
                data.sort((a, b) => {
                    return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
                });

                // สร้างแถวตาราง
                data.forEach(row => {
                    const profitClass = getColorClass(row.profit);
                    const profit7Class = getColorClass(row.profit7day);
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="text-bold">${row.name}</td>
                        <td class="${profitClass}">${row.profit > 0 ? '+' : ''}${formatNumber(row.profit)}</td>
                        <td class="${profit7Class}">${row.profit7day > 0 ? '+' : ''}${formatNumber(row.profit7day)}</td>
                        <td>$${formatNumber(row.balance)}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color: red;">❌ เกิดข้อผิดพลาดในการเชื่อมต่อข้อมูล</td></tr>';
            }
        }

        // เรียกใช้งานทันทีเมื่อเปิดเว็บ
        fetchRealTimeData();
        
        // ตั้งค่าดึงข้อมูลใหม่ทุกๆ 3 วินาที (ด้วย API ตัวนี้ สามารถรับโหลด 50 เครื่องพร้อมกันได้สบายมากครับ)
        setInterval(fetchRealTimeData, 3000); 
    </script>
