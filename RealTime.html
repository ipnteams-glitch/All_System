<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Trading Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1c1f26;
            --text-main: #e2e8f0;
            --gold: #D4AF37;
            --green: #10b981;
            --red: #ef4444;
            --border: #2d333b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 20px 10px; 
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto; 
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .header-box h1 {
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .header-box p {
            color: #8b949e;
            margin-top: 0;
            font-size: 14px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right; 
        }

        th, td {
            padding: 16px 20px;
            white-space: nowrap;
        }

        th {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            font-weight: 500;
            font-size: 15px;
            border-bottom: 2px solid var(--gold);
        }

        th:first-child, td:first-child {
            text-align: left; 
        }

        td {
            border-bottom: 1px solid var(--border);
            font-size: 15px;
            color: #c9d1d9;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
            transition: 0.2s;
        }

        .text-green { color: var(--green); font-weight: 500; }
        .text-red { color: var(--red); font-weight: 500; }
        .text-bold { font-weight: 600; }

        .loader {
            text-align: center;
            padding: 40px;
            color: var(--gold);
            font-size: 18px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: #8b949e;
            text-decoration: none;
            border: 1px solid #8b949e;
            padding: 8px 20px;
            border-radius: 6px;
            transition: 0.3s;
        }
        
        .back-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        @media (max-width: 600px) {
            th, td {
                padding: 12px 10px; 
                font-size: 13px; 
            }
            th {
                font-size: 12px;
            }
            .header-box h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <h1>🏆 Live Trading Performance</h1>
            <p>อัปเดตข้อมูลพอร์ตการลงทุนแบบ Real-Time</p>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ชื่อ EA</th>
                        <th>กำไรปัจจุบัน</th>
                        <th>กำไรสัปดาห์ปัจจุบัน</th>
                        <th>ทุนเริ่มต้น</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4">
                            <div class="loader">⏳ กำลังโหลดข้อมูล...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-btn">← กลับหน้าหลัก</a>
        </div>
    </div> <script>
        const SHEET_ID = "1B2XVPTkg4HBtd8XlQBwOSlisakAkyR1HbGIz1-wVxAU";
        const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;

        function formatNumber(num) {
            return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function getColorClass(num) {
            if (num > 0) return 'text-green';
            if (num < 0) return 'text-red';
            return '';
        }

        async function fetchRealTimeData() {
            try {
                const cacheBuster = "&t=" + new Date().getTime();
                const response = await fetch(GVIZ_URL + cacheBuster);
                const text = await response.text();
                
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const jsonData = JSON.parse(jsonString);
                
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = ''; 

                const rows = jsonData.table.rows;

                if (!rows || rows.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ไม่มีข้อมูลแสดงผล</td></tr>';
                    return;
                }

                let data = [];
                
                rows.forEach(row => {
                    if (row.c && row.c[0] && row.c[0].v !== null && String(row.c[0].v).toLowerCase() !== "acc_number") {
                        data.push({
                            name: row.c[1] && row.c[1].v !== null ? row.c[1].v : "-",
                            balance: row.c[2] && row.c[2].v !== null ? parseFloat(row.c[2].v) : 0,
                            profit: row.c[4] && row.c[4].v !== null ? parseFloat(row.c[4].v) : 0,
                            profit7day: row.c[6] && row.c[6].v !== null ? parseFloat(row.c[6].v) : 0
                        });
                    }
                });

                data.sort((a, b) => {
                    return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
                });

                data.forEach(row => {
                    const profitClass = getColorClass(row.profit);
                    const profit7Class = getColorClass(row.profit7day);
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="text-bold">${row.name}</td>
                        <td class="${profitClass}">${row.profit > 0 ? '+' : ''}${formatNumber(row.profit)}</td>
                        <td class="${profit7Class}">${row.profit7day > 0 ? '+' : ''}${formatNumber(row.profit7day)}</td>
                        <td>$${formatNumber(row.balance)}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color: red;">❌ เกิดข้อผิดพลาดในการเชื่อมต่อข้อมูล</td></tr>';
            }
        }

        fetchRealTimeData();
        setInterval(fetchRealTimeData, 3000); 
    </script>
</body>
</html>
