<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Trading Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
        <style>
        :root {
            --bg: #080012;
            --card: #1a0a35;
            --accent: #a855f7;
            --accent-glow: #c084fc;
            --magenta: #d946ef;
            --profit: #22c55e;
            --loss: #ef4444;
            --text: #e8e0f0;
            --text-dim: #a094b8;
            --border: #2d1f4e;
        }
        body {
            background: radial-gradient(ellipse at 50% 0%, #1a0a35 0%, #080012 60%);
            color: var(--text);
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 20px 10px; 
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto; 
        }
        .header-box {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }
        .header-box h1 {
            color: #c084fc;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.5), 0 0 40px rgba(217, 70, 239, 0.2);
        }
        .header-box p {
            color: #a094b8;
            margin-top: 0;
            font-size: 14px;
        }

        /* ── Table ── */
        .table-container {
            background: rgba(26, 10, 53, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            overflow-x: auto; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right; 
        }
        th, td {
            padding: 12px 14px;
            white-space: nowrap;
        }
        th:first-child, td:first-child {
            min-width: 130px;
        }
        .ea-name-cell {
            font-weight: bold;
            color: #c084fc;
            font-size: 14px;
        }
        th {
            background: linear-gradient(180deg, rgba(124, 58, 237, 0.2), rgba(124, 58, 237, 0.05));
            color: #c084fc;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 2px solid rgba(168, 85, 247, 0.4);
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
        }
        th:first-child, td:first-child {
            text-align: left; 
        }
        td {
            border-bottom: 1px solid rgba(168, 85, 247, 0.08);
            font-size: 15px;
            color: var(--text);
        }

        /* ── Alternating row colors ── */
        tbody tr:nth-child(even) {
            background: rgba(124, 58, 237, 0.04);
        }
        tbody tr:nth-child(odd) {
            background: rgba(0, 0, 0, 0.15);
        }
        tbody tr:hover {
            background: rgba(168, 85, 247, 0.1) !important;
            box-shadow: inset 0 0 30px rgba(168, 85, 247, 0.05);
            transition: all 0.2s ease;
        }

        .text-green { color: var(--profit); font-weight: 500; }
        .text-red { color: var(--loss); font-weight: 500; }
        .text-bold { font-weight: 600; }
        .loader {
            text-align: center;
            padding: 40px;
            color: #c084fc;
            font-size: 18px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: #a094b8;
            text-decoration: none;
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 10px 24px;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: 500;
        }
        .back-btn:hover {
            border-color: #c084fc;
            color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        /* ── Summary Row ── */
        tfoot td {
            background: linear-gradient(90deg, rgba(124, 58, 237, 0.2), rgba(124, 58, 237, 0.05));
            border-top: 2px solid rgba(168, 85, 247, 0.5);
            font-weight: 600;
            font-size: 16px;
            color: #c084fc;
            padding: 14px 20px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }
        tfoot td:first-child {
            text-align: right;
            letter-spacing: 1px;
        }

        /* ── Stars ── */
        .stars {
            display: inline-block;
            font-size: 16px;
            letter-spacing: 2px;
            margin-top: 2px;
        }
        .star-on { color: #d946ef; text-shadow: 0 0 6px rgba(217, 70, 239, 0.4); }
        .star-off { color: #3a2f50; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.5); }

        /* ── Live pulse indicator ── */
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: livePulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }
            50% { opacity: 0.4; box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
        }

        @media (max-width: 600px) {
            th, td { padding: 8px 6px; font-size: 11px; }
            th { font-size: 10px; }
            .header-box h1 { font-size: 20px; }
            th:first-child, td:first-child { min-width: 80px; }
            .ea-name-cell { font-size: 10px; }
            .stars { font-size: 11px; letter-spacing: 0; }
            tfoot td { font-size: 12px; padding: 10px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>🏆 Live Trading Performance</h1>
            <p>อัปเดตข้อมูลพอร์ตการลงทุนแบบ Real-Time</p>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ชื่อ EA</th>
                        <th>กำไรปัจจุบัน</th>
                        <th>สัปดาห์นี้</th>
                        <th>สัปดาห์ที่แล้ว</th>
                        <th>ทุนเริ่มต้น</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5"><div class="loader">⏳ กำลังโหลดข้อมูล...</div></td>
                    </tr>
                </tbody>
                <tfoot id="tableFoot" style="display:none;">
                    <tr>
                        <td>📊 ผลรวม</td>
                        <td id="sumProfit">-</td>
                        <td id="sumWeek">-</td>
                        <td id="sumLastWeek">-</td>
                        <td id="sumBalance">-</td>
                    </tr>
                </tfoot>
            </table>
        </div>
        <div style="text-align: center;">
            <a href="index.html" class="back-btn">← กลับหน้าหลัก</a>
        </div>
    </div> 
<script>
    const SHEET_ID = "1B2XVPTkg4HBtd8XlQBwOSlisakAkyR1HbGIz1-wVxAU";
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;

    function formatNumber(num) {
        if (isNaN(num)) return "0.00";
        return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatInteger(num) {
        if (isNaN(num)) return "0";
        return Math.round(num).toLocaleString('en-US', { maximumFractionDigits: 0 });
    }

    // ⭐ สร้าง HTML ดาว
    function renderStars(count) {
        let html = '<div class="stars">';
        for (let i = 0; i < 5; i++) {
            html += i < count ? '<span class="star-on">★</span>' : '<span class="star-off">★</span>';
        }
        html += '</div>';
        return html;
    }

    async function fetchRealTimeData() {
        try {
            const cacheBuster = "&t=" + new Date().getTime();
            const response = await fetch(GVIZ_URL + cacheBuster);
            const text = await response.text();
            const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
            const jsonData = JSON.parse(jsonString);
            const tableBody = document.getElementById('tableBody') || document.querySelector('tbody');
            if (!tableBody) return;
            tableBody.innerHTML = ''; 
            const rows = jsonData.table.rows;
            if (!rows || rows.length <= 1) { 
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">กำลังรอรับข้อมูลจากระบบ...</td></tr>';
                return;
            }
            let data = [];
            for (let i = 0; i < rows.length; i++) {
                let row = rows[i];
                if (row && row.c && row.c[0] && row.c[0].v !== null && String(row.c[0].v).toLowerCase() !== "acc") { 
                    const balance = row.c[2] && row.c[2].v !== null ? parseFloat(row.c[2].v) : 0;
                    const profit7day = row.c[6] && row.c[6].v !== null ? parseFloat(row.c[6].v) : 0;
                    const lastWeekProfit = row.c[7] && row.c[7].v !== null ? parseFloat(row.c[7].v) : 0;
                    // ⭐ ดึงค่าดาวโดยตรงจากคอลัมน์ I (index 8) — คำนวณฝั่ง server แล้ว
                    const stars = row.c[8] && row.c[8].v !== null ? parseInt(row.c[8].v) : 0;
                    data.push({
                        name: row.c[1] && row.c[1].v !== null ? row.c[1].v : "-",
                        balance: balance,
                        profit: row.c[4] && row.c[4].v !== null ? parseFloat(row.c[4].v) : 0,
                        profit7day: profit7day,
                        lastWeekProfit: lastWeekProfit,
                        stars: stars
                    });
                }
            }
            data.sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { numeric: true, sensitivity: 'base' }));
            
            let sumProfit = 0, sumWeek = 0, sumLastWeek = 0, sumBalance = 0;
            
            data.forEach(row => {
                sumProfit += row.profit;
                sumWeek += row.profit7day;
                sumLastWeek += row.lastWeekProfit;
                sumBalance += row.balance;
                
                let profitColor = row.profit > 0 ? '#4cd137' : (row.profit < 0 ? '#ff3b3b' : '#ffffff');
                let p7Color = row.profit7day > 0 ? '#4cd137' : (row.profit7day < 0 ? '#ff3b3b' : '#ffffff');
                let lwColor = row.lastWeekProfit > 0 ? '#4cd137' : (row.lastWeekProfit < 0 ? '#ff3b3b' : '#ffffff');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <span class="ea-name-cell">${row.name}</span>
                        ${renderStars(row.stars)}
                    </td>
                    <td style="color: ${profitColor}; font-weight: 500;">${row.profit > 0 ? '+' : ''}${formatNumber(row.profit)}</td>
                    <td style="color: ${p7Color}; font-weight: 500;">${row.profit7day > 0 ? '+' : ''}${formatInteger(row.profit7day)}</td>
                    <td style="color: ${lwColor}; font-weight: 500;">${row.lastWeekProfit > 0 ? '+' : ''}${formatInteger(row.lastWeekProfit)}</td>
                    <td>$${formatInteger(row.balance)}</td>
                `;
                tableBody.appendChild(tr);
            });
            
            // Summary row
            const sumColor = sumProfit > 0 ? '#4cd137' : (sumProfit < 0 ? '#ff3b3b' : '#D4AF37');
            const weekColor = sumWeek > 0 ? '#4cd137' : (sumWeek < 0 ? '#ff3b3b' : '#D4AF37');
            const lwColor = sumLastWeek > 0 ? '#4cd137' : (sumLastWeek < 0 ? '#ff3b3b' : '#D4AF37');
            document.getElementById('sumProfit').innerHTML = `<span style="color:${sumColor}">${sumProfit > 0 ? '+' : ''}${formatNumber(sumProfit)}</span>`;
            document.getElementById('sumWeek').innerHTML = `<span style="color:${weekColor}">${sumWeek > 0 ? '+' : ''}${formatInteger(sumWeek)}</span>`;
            document.getElementById('sumLastWeek').innerHTML = `<span style="color:${lwColor}">${sumLastWeek > 0 ? '+' : ''}${formatInteger(sumLastWeek)}</span>`;
            document.getElementById('sumBalance').innerHTML = `$${formatInteger(sumBalance)}`;
            document.getElementById('tableFoot').style.display = '';
        } catch (error) {
            console.error("Fetch Error:", error);
            const tableBody = document.getElementById('tableBody') || document.querySelector('tbody');
            if(tableBody) {
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: #ff3b3b; padding: 20px;">❌ เกิดข้อผิดพลาด หรือไฟล์ Google Sheet ยังไม่เปิดแชร์</td></tr>';
            }
        }
    }

    fetchRealTimeData();
    setInterval(fetchRealTimeData, 3000); 
</script>    
</body>
</html>
