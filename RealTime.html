<script>
        // 🔴 1. นำลิงก์ CSV ที่คุณทำไว้ในขั้นตอนที่ 2 มาใส่ตรงนี้ครับ
        const CSV_URL = "https://docs.google.com/spreadsheets/d/1B2XVPTkg4HBtd8XlQBwOSlisakAkyR1HbGIz1-wVxAU/export?format=csv&gid=0";

        function formatNumber(num) {
            return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function getColorClass(num) {
            if (num > 0) return 'text-green';
            if (num < 0) return 'text-red';
            return '';
        }

        async function fetchRealTimeData() {
            try {
                // ใส่ตัวแปรกำจัด Cache ของ Browser เพื่อให้ดึงข้อมูลใหม่ล่าสุดเสมอ (สำคัญมากสำหรับอัปเดตทุก 3 วิ)
                const cacheBuster = "&t=" + new Date().getTime();
                const response = await fetch(CSV_URL + cacheBuster);
                const csvText = await response.text();
                
                // แกะไฟล์ CSV แบ่งออกเป็นทีละบรรทัด
                const rows = csvText.split('\n').map(row => row.trim()).filter(row => row !== '');
                
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = ''; 

                // หากมีแต่หัวตาราง หรือไม่มีข้อมูล
                if (rows.length <= 1) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ไม่มีข้อมูลแสดงผล</td></tr>';
                    return;
                }

                // แปลงข้อมูล CSV ให้อยู่ในรูปแบบ Object
                let data = [];
                for (let i = 1; i < rows.length; i++) { 
                    const cols = rows[i].split(',');
                    // คอลัมน์อ้างอิง: B=1(ชื่อ), C=2(ทุน), E=4(กำไรปัจจุบัน), G=6(กำไร 7 วัน)
                    if (cols.length >= 7 && cols[0] !== "") {
                        data.push({
                            name: cols[1],
                            balance: parseFloat(cols[2] || 0),
                            profit: parseFloat(cols[4] || 0),
                            profit7day: parseFloat(cols[6] || 0)
                        });
                    }
                }

                // จัดเรียงชื่อ EA อย่างถูกต้อง (Sys1, Sys2... Sys10)
                data.sort((a, b) => {
                    return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
                });

                // วนลูปสร้างแถวตารางแบบ 4 คอลัมน์
                data.forEach(row => {
                    const profitClass = getColorClass(row.profit);
                    const profit7Class = getColorClass(row.profit7day);
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="text-bold">${row.name}</td>
                        <td class="${profitClass}">${row.profit > 0 ? '+' : ''}${formatNumber(row.profit)}</td>
                        <td class="${profit7Class}">${row.profit7day > 0 ? '+' : ''}${formatNumber(row.profit7day)}</td>
                        <td>$${formatNumber(row.balance)}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color: red;">❌ เกิดข้อผิดพลาดในการเชื่อมต่อข้อมูล</td></tr>';
            }
        }

        // เรียกใช้งานทันทีเมื่อเปิดเว็บ
        fetchRealTimeData();
        
        // 🎯 ตั้งค่าดึงข้อมูลใหม่ทุกๆ 3 วินาที (ตอนนี้ตั้ง 3 วิได้เลยครับ เพราะดึงตรงจาก Sheet แล้ว ไม่ผ่าน Apps Script)
        setInterval(fetchRealTimeData, 3000); 
    </script>
