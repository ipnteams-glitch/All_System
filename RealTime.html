<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Trading Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
   <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1c1f26;
            --text-main: #e2e8f0;
            --gold: #D4AF37;
            --green: #10b981;
            --red: #ef4444;
            --border: #2d333b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Kanit', sans-serif;
            margin: 0;
            /* แก้ไข: ลบ display flex แบบเดิมออก ป้องกันตารางตกขอบซ้ายบนมือถือ */
            padding: 20px 10px; 
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto; /* แก้ไข: จัดกึ่งกลางด้วย margin auto แทน */
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .header-box h1 {
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .header-box p {
            color: #8b949e;
            margin-top: 0;
            font-size: 14px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto; /* ให้เอานิ้วเลื่อนซ้ายขวาได้ถ้าจอเล็กมาก */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right; 
        }

        th, td {
            padding: 16px 20px;
            white-space: nowrap;
        }

        th {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            font-weight: 500;
            font-size: 15px;
            border-bottom: 2px solid var(--gold);
        }

        th:first-child, td:first-child {
            text-align: left; 
        }

        td {
            border-bottom: 1px solid var(--border);
            font-size: 15px;
            color: #c9d1d9;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
            transition: 0.2s;
        }

        .text-green { color: var(--green); font-weight: 500; }
        .text-red { color: var(--red); font-weight: 500; }
        .text-bold { font-weight: 600; }

        .loader {
            text-align: center;
            padding: 40px;
            color: var(--gold);
            font-size: 18px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: #8b949e;
            text-decoration: none;
            border: 1px solid #8b949e;
            padding: 8px 20px;
            border-radius: 6px;
            transition: 0.3s;
        }
        
        .back-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ========================================= */
        /* 📱 ระบบปรับขนาดอัตโนมัติสำหรับหน้าจอมือถือ */
        /* ========================================= */
        @media (max-width: 600px) {
            th, td {
                padding: 12px 10px; /* ลดช่องว่างตารางลงให้พอดีจอ */
                font-size: 13px; /* ปรับลดขนาดฟอนต์นิดหน่อย */
            }
            th {
                font-size: 12px;
            }
            .header-box h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ชื่อ EA</th>
                        <th>กำไรปัจจุบัน</th>
                        <th>กำไรสัปดาห์ปัจจุบัน</th>
                        <th>ทุนเริ่มต้น</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4">
                            <div class="loader">⏳ กำลังโหลดข้อมูล...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-btn">← กลับหน้าหลัก</a>
        </div>
    </div>

    <script>
        // 🔴 นำ URL ของ Apps Script ที่ได้จาก Google Sheet มาใส่ตรงนี้
        const API_URL = "https://script.google.com/macros/s/AKfycbwc8soxHbVfzpmIwzMJqUrHgc7MQfEfJ4_cxj-_DpN-5jWJfBEMeKuxsC7T4nTXpXZh/exec";

        function formatNumber(num) {
            return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function getColorClass(num) {
            if (num > 0) return 'text-green';
            if (num < 0) return 'text-red';
            return '';
        }

        async function fetchRealTimeData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = ''; 

                if (data.length === 0) {
                    // เปลี่ยน colspan เป็น 4 ให้ตรงกับจำนวนคอลัมน์
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ไม่มีข้อมูลแสดงผล</td></tr>';
                    return;
                }

                // จัดเรียงชื่อ EA อย่างถูกต้อง (Sys1, Sys2... Sys10)
                data.sort((a, b) => {
                    return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
                });

                // วนลูปสร้างแถวตารางแบบ 4 คอลัมน์
                data.forEach(row => {
                    const profitClass = getColorClass(row.profit);
                    const profit7Class = getColorClass(row.profit7day);
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="text-bold">${row.name}</td>
                        <td class="${profitClass}">${row.profit > 0 ? '+' : ''}${formatNumber(row.profit)}</td>
                        <td class="${profit7Class}">${row.profit7day > 0 ? '+' : ''}${formatNumber(row.profit7day)}</td>
                        <td>$${formatNumber(row.balance)}</td>
                    `;
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color: red;">❌ เกิดข้อผิดพลาดในการเชื่อมต่อข้อมูล</td></tr>';
            }
        }

        fetchRealTimeData();
        setInterval(fetchRealTimeData, 3000); 
    </script>
</body>
</html>
