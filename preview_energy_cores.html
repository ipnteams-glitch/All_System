<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview - แกนพลังงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Kanit', sans-serif;
            background: #080c14;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 10px;
        }

        h3 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #a0b4d0;
            text-align: center;
        }
        .subtitle {
            font-size: 0.75rem;
            color: #5a6a80;
            margin-bottom: 30px;
            text-align: center;
        }

        .energy-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            max-width: 600px;
        }

        .energy-card {
            position: relative;
            width: 100px;
            height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .energy-card:hover { transform: translateY(-6px) scale(1.05); }

        .core-container {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .outer-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.12);
            animation: ringPulse 3s ease-in-out infinite;
        }
        .energy-card:hover .outer-ring {
            border-color: rgba(255,255,255,0.35);
        }

        .rotating-ring {
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: rgba(100,180,255,0.5);
            border-right-color: rgba(100,180,255,0.2);
            animation: ringSpin 4s linear infinite;
        }
        .rotating-ring:nth-child(3) {
            inset: 16px;
            border-top-color: rgba(180,130,255,0.4);
            border-left-color: rgba(180,130,255,0.2);
            animation-direction: reverse;
            animation-duration: 5s;
        }

        .core-orb {
            position: absolute;
            inset: 22px;
            border-radius: 50%;
            animation: orbBreath 2.5s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 8px currentColor;
            box-shadow: 0 0 20px rgba(255,255,255,0.15), inset 0 0 15px rgba(255,255,255,0.08);
        }

        .sys2 .core-orb { background: radial-gradient(circle at 35% 35%, #4fc3f7, #0277bd); }
        .sys2 .outer-ring { border-color: rgba(79,195,247,0.3); }
        .energy-card.sys2:hover .outer-ring { border-color: rgba(79,195,247,0.6); box-shadow: 0 0 25px rgba(79,195,247,0.25); }

        .sys5 .core-orb { background: radial-gradient(circle at 35% 35%, #81c784, #2e7d32); }
        .sys5 .outer-ring { border-color: rgba(129,199,132,0.3); }
        .energy-card.sys5:hover .outer-ring { border-color: rgba(129,199,132,0.6); box-shadow: 0 0 25px rgba(129,199,132,0.25); }

        .sys7 .core-orb { background: radial-gradient(circle at 35% 35%, #ffb74d, #e65100); }
        .sys7 .outer-ring { border-color: rgba(255,183,77,0.3); }
        .energy-card.sys7:hover .outer-ring { border-color: rgba(255,183,77,0.6); box-shadow: 0 0 25px rgba(255,183,77,0.25); }

        .sys9 .core-orb { background: radial-gradient(circle at 35% 35%, #ce93d8, #6a1b9a); }
        .sys9 .outer-ring { border-color: rgba(206,147,216,0.3); }
        .energy-card.sys9:hover .outer-ring { border-color: rgba(206,147,216,0.6); box-shadow: 0 0 25px rgba(206,147,216,0.25); }

        .sys13 .core-orb { background: radial-gradient(circle at 35% 35%, #ef5350, #b71c1c); }
        .sys13 .outer-ring { border-color: rgba(239,83,80,0.3); }
        .energy-card.sys13:hover .outer-ring { border-color: rgba(239,83,80,0.6); box-shadow: 0 0 25px rgba(239,83,80,0.25); }

        .core-label {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #b0c4de;
            letter-spacing: 1px;
            text-align: center;
            transition: color 0.3s;
        }
        .energy-card:hover .core-label { color: #fff; }

        .fx-badge {
            margin-top: 2px;
            font-size: 0.6rem;
            color: #5a7a90;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
        .energy-card:hover .fx-badge { opacity: 1; color: #7ab0d0; }

        @keyframes ringPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }
        @keyframes orbBreath {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255,255,255,0.15), inset 0 0 15px rgba(255,255,255,0.08); }
            50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(255,255,255,0.25), inset 0 0 25px rgba(255,255,255,0.15); }
        }

        .section-header {
            text-align: center;
            margin-bottom: 5px;
        }
        .section-header .icon { font-size: 1.4rem; }
        .section-header .text {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #64b5f6, #ce93d8, #64b5f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
